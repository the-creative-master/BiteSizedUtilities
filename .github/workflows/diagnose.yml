name: Diagnose the deployed runtimes

# Throwaway. Exists to answer one question — which layer refuses
# runtimes/worker.js on GitHub Pages — from a browser that can reach the live
# site. It does not build, deploy or publish anything, and it comes back out of
# the repository with the fix it was written for.
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run the browser half of the suite
        run: node --test tests/sw-runtime-worker.test.js > DIAGNOSIS.txt 2>&1 || true
      - name: Show it
        run: cat DIAGNOSIS.txt

      # The runner's log lives on a host this session cannot read, so the
      # findings come back the way everything else does: as a file in the branch.
      - name: Hand the diagnosis back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIAGNOSIS.txt
          git commit -m "diagnosis: the browser half of the suite, from a runner that has one"
          git push origin HEAD:${{ github.ref_name }}
