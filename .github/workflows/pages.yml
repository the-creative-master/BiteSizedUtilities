name: Deploy the little tool kitchen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  # Write, and only for one step: publishing the offline zip as a release asset.
  # The archive is 224 MB, which would otherwise be uploaded into Pages on every
  # deploy and downloaded out of the site's own monthly bandwidth.
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Serve the small models from this origin instead of making every visitor
      # download them from Hugging Face. Runs after the tests so nothing they
      # assert about an empty cache can be disturbed, and never fails the
      # deploy: without it the site works exactly as it did before.
      - name: Restore pre-cached model weights
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .cache/waffle-ai
          key: waffle-ai-models-${{ hashFiles('waffle-browser-ai.js', 'scripts/fetch-model.mjs') }}
          restore-keys: waffle-ai-models-
      - name: Pre-cache the models this site can serve
        continue-on-error: true
        run: npm run precache
      # The step above cannot fail the deploy, so this is the line that says
      # whether the site is about to carry its own model weights or whether every
      # visitor will download them from Hugging Face again.
      - name: Report the weights this deploy will serve
        run: ls -l .cache/waffle-ai/*.gguf || echo "no self-hosted model weights in this deploy"
      # The zip is made from dist/, so it has to come after the build — and after
      # the model weights are copied into it, which the build also does. That is
      # what makes this an offline archive rather than a copy of the source.
      - name: Build the site, then pack it into the offline zip
        run: npm run build && npm run zip:offline
      # The suite above ran before there was an archive to look at, so the tests
      # that open one skipped. Run them again now that there is something to open:
      # that the required entries are in it, that the notes were stamped, and that
      # the metadata the button reads describes the file just built.
      - name: Verify the archive that was just packed
        run: node --test tests/offline-zip.test.js
      # The same question, asked of the thing that actually ships. The report above
      # runs before the build, so all it can say is what the cache handed over: the
      # build then copies .cache/waffle-ai/*.gguf into dist/api/waffle-ai/gguf/ under
      # a size budget, and only this line says whether anything survived that copy.
      - name: Report the weights inside the artifact
        run: ls -l dist/api/waffle-ai/gguf/*.gguf || echo "the build shipped no model weights of its own"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Idempotent on purpose: create is a no-op once the release exists, and the
      # upload replaces the asset in place, so every deploy to main publishes the
      # zip that matches it. --latest=false because "Latest" belongs to the
      # version releases a person cuts by hand, not to a rolling build artifact.
      - name: Publish the offline zip as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="BiteSizedUtilities - the whole site, offline"
          NOTES=dist-zip/RELEASE-NOTES.md
          # --latest=false so this rolling artifact never takes the "Latest" slot
          # away from a version release that a person cut by hand. The fallback is
          # here so an older gh that does not accept the flag still publishes
          # rather than blocking a deploy over a cosmetic preference.
          gh release create offline-zip --title "$TITLE" --notes-file "$NOTES" --latest=false 2>/dev/null \
            || gh release create offline-zip --title "$TITLE" --notes-file "$NOTES" 2>/dev/null \
            || true
          # Refreshed every deploy, so the notes quote the size of the archive that
          # is actually attached rather than the one from the day the release was made.
          gh release edit offline-zip --title "$TITLE" --notes-file "$NOTES"
          gh release upload offline-zip dist-zip/BiteSizedUtilities-offline.zip --clobber
          gh release view offline-zip --json assets --jq '.assets[] | "offline zip published: \(.name) \(.size) bytes"'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
