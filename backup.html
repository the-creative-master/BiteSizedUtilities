<!doctype html>
<html lang="en" data-backup="1"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5cb7d"><meta name="description" content="The same cozy 2.5D kitchen, with Waffle AI and every AI control switched on."><meta name="robots" content="noindex,nofollow"><title>BiteSized Utilities — Backup Kitchen</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./fonts/fonts.css"></head><body style="margin:0;background:#eccd8f;color:#4f2f23;font-family:system-ui,sans-serif"><div id="app"></div><script>(function(){function showFallback(msg){var el=document.getElementById('app');if(el&&!el.children.length){el.innerHTML='<div style="max-width:520px;margin:48px auto;padding:20px;background:#fff8e8;border:3px solid #4f2f23;border-radius:18px;font-weight:700"><h2>Waffle Kitchen hiccup</h2><p>'+(msg||'Could not finish loading scripts.')+'</p><button id="waffle-hard-reload" style="padding:10px 16px;border:3px solid #4f2f23;border-radius:12px;background:#ffe58f;font-weight:800;cursor:pointer">Clear Cache &amp; Reload</button></div>';var b=document.getElementById('waffle-hard-reload');if(b)b.onclick=async function(){try{if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister();}));}if(window.caches){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}}catch(e){}location.href=location.pathname+'?v='+Date.now()+location.hash;};}}window.addEventListener('error',function(e){showFallback(e.message);});window.addEventListener('unhandledrejection',function(e){showFallback(e.reason&&e.reason.message?e.reason.message:String(e.reason||''));});setTimeout(function(){showFallback('Loading took too long — tap below to clear stale browser cache.');},8000);})();</script><script type="module" src="./app.js"></script></body></html>
