<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pop-a-Balloon TD (Bloons Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#e4f5da;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:740px;background:#fff9ec;border:4px solid #4b2e20;border-radius:24px;padding:12px;box-shadow:0 10px 0 #8fbd7b}
  .hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px}
  .shop{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .tbtn{border:3px solid #4b2e20;border-radius:14px;padding:6px 12px;font-weight:900;cursor:pointer;background:#ffd3b8}
  .tbtn.sel{background:#9ee09e;box-shadow:0 4px 0 #66a666}
  canvas{width:100%;height:auto;border:3.5px solid #4b2e20;border-radius:16px;background:#bde3a8;display:block;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="pill" id="coins">🪙 150</div>
    <div class="pill" id="lives">❤️ 20</div>
    <div class="pill" id="wave">Wave 0</div>
    <button class="pill" id="waveBtn" style="background:#9ee09e;cursor:pointer">▶ Start Wave</button>
  </div>
  <div class="shop">
    <button class="tbtn sel" data-type="dart">🎯 Dart Chef (50🪙)</button>
    <button class="tbtn" data-type="tack">✴️ Tack Toaster (85🪙)</button>
    <button class="tbtn" data-type="cannon">💣 Syrup Cannon (120🪙)</button>
  </div>
  <canvas id="c" width="680" height="360"></canvas>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const PATH = [[0,90],[180,90],[180,270],[390,270],[390,90],[570,90],[570,280],[680,280]];
const COSTS = { dart: 50, tack: 85, cannon: 120 };
const COLORS = ['#ff7d7d', '#7dc4ff', '#9be082', '#ffe074'];
let coins = 150, lives = 20, wave = 0, sel = 'dart', towers = [], bloons = [], darts = [], spawning = 0;

document.querySelectorAll('.tbtn').forEach(b => b.onclick = () => {
  sel = b.dataset.type;
  document.querySelectorAll('.tbtn').forEach(x => x.classList.toggle('sel', x === b));
});

function hud() {
  document.getElementById('coins').textContent = `🪙 ${coins}`;
  document.getElementById('lives').textContent = `❤️ ${lives}`;
  document.getElementById('wave').textContent = `Wave ${wave}`;
}

c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * c.width / r.width;
  const y = (e.clientY - r.top) * c.height / r.height;
  const cost = COSTS[sel];
  if (coins < cost) return;
  coins -= cost;
  towers.push({ x, y, type: sel, cd: 0 });
  hud();
});

document.getElementById('waveBtn').onclick = () => {
  wave++;
  spawning += 8 + wave * 4;
  hud();
};

function moveBloon(b) {
  const tgt = PATH[b.seg + 1];
  if (!tgt) {
    lives = Math.max(0, lives - b.hp);
    hud();
    return false;
  }
  const dx = tgt[0] - b.x, dy = tgt[1] - b.y, d = Math.hypot(dx, dy);
  const spd = 1.4 + b.hp * 0.25;
  if (d <= spd) { b.x = tgt[0]; b.y = tgt[1]; b.seg++; }
  else { b.x += dx / d * spd; b.y += dy / d * spd; }
  return true;
}

let tick = 0;
function loop() {
  tick++;
  if (spawning > 0 && tick % 24 === 0) {
    spawning--;
    const hp = Math.min(4, 1 + Math.floor((wave - 1) / 2) + (Math.random() < 0.25 ? 1 : 0));
    bloons.push({ x: PATH[0][0], y: PATH[0][1], seg: 0, hp });
  }

  for (const t of towers) {
    if (t.cd > 0) { t.cd--; continue; }
    const range = t.type === 'tack' ? 95 : t.type === 'cannon' ? 145 : 130;
    const hit = bloons.find(b => Math.hypot(b.x - t.x, b.y - t.y) <= range);
    if (!hit) continue;
    if (t.type === 'tack') {
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * Math.PI * 2;
        darts.push({ x: t.x, y: t.y, vx: Math.cos(ang) * 6, vy: Math.sin(ang) * 6, life: 16, splash: false });
      }
      t.cd = 42;
    } else {
      const ang = Math.atan2(hit.y - t.y, hit.x - t.x);
      darts.push({ x: t.x, y: t.y, vx: Math.cos(ang) * 8, vy: Math.sin(ang) * 8, life: 26, splash: t.type === 'cannon' });
      t.cd = t.type === 'cannon' ? 48 : 24;
    }
  }

  for (let i = darts.length - 1; i >= 0; i--) {
    const d = darts[i];
    d.x += d.vx; d.y += d.vy; d.life--;
    let popped = false;
    for (let j = bloons.length - 1; j >= 0; j--) {
      const b = bloons[j];
      if (Math.hypot(b.x - d.x, b.y - d.y) < (d.splash ? 36 : 18)) {
        b.hp--; coins += 4;
        if (b.hp <= 0) { bloons.splice(j, 1); coins += 6; }
        hud();
        popped = true;
        if (!d.splash) break;
      }
    }
    if (popped || d.life <= 0) darts.splice(i, 1);
  }

  bloons = bloons.filter(moveBloon);

  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#e5c188'; ctx.lineWidth = 42; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(PATH[0][0], PATH[0][1]);
  for (const [px, py] of PATH) ctx.lineTo(px, py);
  ctx.stroke();

  for (const t of towers) {
    ctx.fillStyle = t.type === 'dart' ? '#ffd3b8' : t.type === 'tack' ? '#ffe599' : '#dfd0f5';
    ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, 7); ctx.fill(); ctx.stroke();
  }
  for (const b of bloons) {
    ctx.fillStyle = COLORS[(b.hp - 1) % COLORS.length];
    ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 12, 15, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#4b2e20';
  for (const d of darts) {
    ctx.beginPath(); ctx.arc(d.x, d.y, d.splash ? 6 : 4, 0, 7); ctx.fill();
  }
  if (lives <= 0) {
    ctx.fillStyle = 'rgba(255,249,236,0.9)'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#4b2e20'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('POPPED OUT! Reload to defend again!', 340, 180);
  }
  requestAnimationFrame(loop);
}
hud();
loop();
</script>
</body>
</html>
