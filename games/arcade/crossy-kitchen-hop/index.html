<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crossy Counter Hop</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#fde9c6;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:540px;background:#fff9ec;border:4px solid #4b2e20;border-radius:26px;padding:14px;box-shadow:0 10px 0 #c99259;text-align:center}
  .hud{display:flex;justify-content:space-between;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 14px;font-weight:900}
  canvas{width:100%;max-width:440px;height:auto;border:3.5px solid #4b2e20;border-radius:18px;background:#c5e8c2;display:block;margin:0 auto}
  .pad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:10px}
  .db{height:48px;border:3px solid #4b2e20;border-radius:14px;background:#ffd3b8;font-size:20px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="pill" id="score">Hops: 0</div>
    <div class="pill" id="best">Best: 0</div>
    <button class="pill" onclick="reset()" style="cursor:pointer;background:#ffd2c2">↻</button>
  </div>
  <canvas id="c" width="440" height="440"></canvas>
  <div class="pad">
    <div></div><button class="db" onclick="hop(0,-1)">▲</button><div></div>
    <button class="db" onclick="hop(-1,0)">◀</button><button class="db" onclick="hop(0,1)">▼</button><button class="db" onclick="hop(1,0)">▶</button>
  </div>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const S = 44;
let player, lanes, best = 0, dead = false;

function makeLane(row) {
  if (row >= 8) return { type: 'grass', obs: [] };
  const isRoad = row % 2 === 1;
  const spd = (row % 3 === 0 ? -1 : 1) * (1.8 + Math.random() * 1.6);
  const obs = [];
  for (let i = 0; i < 3; i++) obs.push({ x: i * 165 + Math.random() * 40, w: isRoad ? 54 : 84 });
  return { type: isRoad ? 'road' : 'syrup', spd, obs };
}

function reset() {
  dead = false;
  player = { col: 5, row: 9, hops: 0 };
  lanes = Array.from({ length: 10 }, (_, r) => makeLane(r));
  document.getElementById('score').textContent = 'Hops: 0';
}

window.hop = (dc, dr) => {
  if (dead) { reset(); return; }
  player.col = Math.max(0, Math.min(9, player.col + dc));
  if (dr < 0) {
    player.hops++;
    best = Math.max(best, player.hops);
    document.getElementById('score').textContent = `Hops: ${player.hops}`;
    document.getElementById('best').textContent = `Best: ${best}`;
    lanes.pop();
    lanes.unshift(makeLane(0));
  } else if (dr > 0) {
    player.row = Math.min(9, player.row + 1);
  }
};

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'w') hop(0, -1);
  if (e.key === 'ArrowDown' || e.key === 's') hop(0, 1);
  if (e.key === 'ArrowLeft' || e.key === 'a') hop(-1, 0);
  if (e.key === 'ArrowRight' || e.key === 'd') hop(1, 0);
});

function loop() {
  ctx.clearRect(0, 0, c.width, c.height);
  lanes.forEach((ln, r) => {
    const y = r * S;
    ctx.fillStyle = ln.type === 'grass' ? '#b8e0a4' : ln.type === 'road' ? '#ead5b3' : '#d6893a';
    ctx.fillRect(0, y, c.width, S);
    if (ln.spd) {
      for (const o of ln.obs) {
        o.x += ln.spd;
        if (o.x > c.width + 20) o.x = -o.w - 10;
        if (o.x < -o.w - 20) o.x = c.width + 10;
        ctx.fillStyle = ln.type === 'road' ? '#f28268' : '#e5b378';
        ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(o.x, y + 6, o.w, S - 12, 10); ctx.fill(); ctx.stroke();
      }
    }
  });

  if (!dead) {
    const ln = lanes[player.row];
    const px = player.col * S + S / 2;
    if (ln.type === 'road' && ln.obs.some(o => px > o.x - 10 && px < o.x + o.w + 10)) dead = true;
    if (ln.type === 'syrup' && !ln.obs.some(o => px > o.x && px < o.x + o.w)) dead = true;
  }

  ctx.fillStyle = '#ffe17d'; ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.roundRect(player.col * S + 8, player.row * S + 8, S - 16, S - 16, 8); ctx.fill(); ctx.stroke();

  if (dead) {
    ctx.fillStyle = 'rgba(255,249,236,0.92)'; ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(70, 170, 300, 100, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4b2e20'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`SQUISHED AT ${player.hops}!`, 220, 212);
    ctx.font = 'bold 15px sans-serif'; ctx.fillText('Tap any arrow to hop again!', 220, 244);
  }
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
