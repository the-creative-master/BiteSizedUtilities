<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Stack 2.5D (Fancade Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#f7e4bc;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:12px}
  .shell{width:100%;max-width:480px;background:#fff9ec;border:4px solid #4b2e20;border-radius:26px;padding:14px;box-shadow:0 10px 0 #c99259;text-align:center}
  .hud{display:flex;justify-content:space-between;margin-bottom:10px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 14px;font-weight:900}
  canvas{width:100%;height:auto;border-radius:18px;border:3.5px solid #4b2e20;background:#d6eefc;display:block;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <div class="hud">
    <div class="pill" id="score">Height: 0</div>
    <div class="pill" id="best">Best: 0</div>
    <button class="pill" onclick="init()" style="cursor:pointer;background:#c5e8c2">↻ New</button>
  </div>
  <canvas id="c" width="420" height="500"></canvas>
  <p style="margin:10px 0 0;font-weight:800;font-size:14px">Tap anywhere or press SPACE to drop the block cleanly!</p>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const COLORS = ['#f28268','#f5ba5b','#8ac789','#7ec3d4','#b79ee0','#f49ab6'];
let stack = [], mover = null, over = false, best = 0;

function init() {
  over = false;
  stack = [{ x: 110, w: 200, color: COLORS[0] }];
  spawnMover(1);
}
function spawnMover(i) {
  const top = stack[stack.length - 1];
  mover = {
    x: i % 2 ? 20 : 380 - top.w,
    w: top.w,
    vx: (i % 2 ? 1 : -1) * Math.min(6.5, 2.8 + i * 0.16),
    color: COLORS[i % COLORS.length]
  };
}
function drop() {
  if (over) { init(); return; }
  const top = stack[stack.length - 1];
  const left = Math.max(mover.x, top.x);
  const right = Math.min(mover.x + mover.w, top.x + top.w);
  const overlap = right - left;
  if (overlap <= 4) {
    over = true;
    return;
  }
  const snapped = Math.abs(mover.x - top.x) < 6;
  stack.push({ x: snapped ? top.x : left, w: snapped ? top.w : overlap, color: mover.color });
  best = Math.max(best, stack.length - 1);
  document.getElementById('score').textContent = `Height: ${stack.length - 1}`;
  document.getElementById('best').textContent = `Best: ${best}`;
  spawnMover(stack.length);
}

c.addEventListener('pointerdown', drop);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); drop(); } });

function drawBlock(x, y, w, h, color) {
  ctx.strokeStyle = '#4b2e20';
  ctx.lineWidth = 3.5;
  // 2.5D top bevel
  ctx.fillStyle = '#fff9ec';
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + 12, y - 10); ctx.lineTo(x + w + 12, y - 10); ctx.lineTo(x + w, y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Front face
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill(); ctx.stroke();
  // Side depth
  ctx.fillStyle = 'rgba(75,46,32,0.18)';
  ctx.beginPath();
  ctx.moveTo(x + w, y); ctx.lineTo(x + w + 12, y - 10); ctx.lineTo(x + w + 12, y + h - 10); ctx.lineTo(x + w, y + h);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function loop() {
  ctx.clearRect(0, 0, c.width, c.height);
  const h = 28;
  const camY = Math.max(0, (stack.length - 9) * h);
  ctx.save();
  ctx.translate(0, camY);
  stack.forEach((b, idx) => drawBlock(b.x, c.height - 46 - idx * h, b.w, h, b.color));
  if (!over && mover) {
    mover.x += mover.vx;
    if (mover.x < 12 || mover.x + mover.w > c.width - 18) mover.vx *= -1;
    drawBlock(mover.x, c.height - 46 - stack.length * h, mover.w, h, mover.color);
  }
  ctx.restore();
  if (over) {
    ctx.fillStyle = 'rgba(255,249,236,0.92)';
    ctx.strokeStyle = '#4b2e20';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(60, 190, 300, 110, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4b2e20';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('TOWER TOPPLED!', 210, 236);
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Tap to stack again!', 210, 272);
  }
  requestAnimationFrame(loop);
}
init();
loop();
</script>
</body>
</html>
