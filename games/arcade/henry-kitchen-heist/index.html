<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choosing the Syrup (Henry Stickmin Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#f7dfb3;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:12px}
  .box{width:100%;max-width:680px;background:#fff9ec;border:4px solid #4b2e20;border-radius:26px;padding:18px;box-shadow:0 10px 0 #c99259}
  .scene{background:#f7e4bc;border:3.5px solid #4b2e20;border-radius:20px;padding:18px;text-align:center;margin-bottom:14px}
  .art{font-size:62px;line-height:1.1;margin-bottom:8px}
  .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .btn{border:3.5px solid #4b2e20;border-radius:16px;padding:14px 10px;font-size:16px;font-weight:900;background:#bfe0f7;color:#4b2e20;cursor:pointer;box-shadow:0 5px 0 #7da8c9}
  .btn:nth-child(2){background:#ffd3b8;box-shadow:0 5px 0 #c98a65}
  .btn:nth-child(3){background:#c5e8c2;box-shadow:0 5px 0 #82b57f}
  .btn:nth-child(4){background:#dfd0f5;box-shadow:0 5px 0 #a38ec2}
  .fail{background:#ffd2c2;border:3.5px solid #4b2e20;border-radius:18px;padding:16px;text-align:center}
  .badge{display:inline-block;background:#ffe599;border:2.5px solid #4b2e20;border-radius:999px;padding:3px 12px;font-weight:900;margin-bottom:8px}
  @media(max-width:520px){.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span class="badge" id="fails">Fails Found: 0</span>
    <span class="badge" id="ends">Endings: 0 / 3</span>
  </div>
  <div id="stage"></div>
</div>
<script>
const SCENES = {
  start: {
    art: '🧇🔒',
    title: 'Scene 1: The Locked Syrup Vault',
    text: 'Sir Waffle needs the Golden Maple Syrup locked behind a giant toaster vault! Pick your gadget:',
    opts: [
      { label: '⚡ Teleporter', fail: 'You teleported directly inside the toaster. Crispy! (Classic Teleporter Fail)' },
      { label: '🧈 Butter Slip', next: 'hall', msg: 'You buttered the hinges and slid right under!' },
      { label: '🔨 Giant Spoon', fail: 'You bent the spoon like a wet noodle. Guards noticed!' },
      { label: '🎭 Chef Disguise', next: 'hall', msg: 'Guards waved you right in! "Morning, Chef!"' }
    ]
  },
  hall: {
    art: '🚨🧀',
    title: 'Scene 2: The Laser Cheese Hallway',
    text: 'Uh oh! Spinning syrup lasers guard the corridor! How do you cross?',
    opts: [
      { label: '🕺 Distraction Dance', next: 'vault', msg: 'Everyone started dancing, even the security cameras!' },
      { label: '🧀 Eat the Lasers', fail: 'Turns out lasers are NOT made of melted cheese.' },
      { label: '🪁 Paper Airplane', fail: 'You folded yourself into a plane and flew straight into a wall.' }
    ]
  },
  vault: {
    art: '🍯👑',
    title: 'Scene 3: The Golden Syrup Pedestal!',
    text: 'The Golden Maple Bottle is right there! Grab it & escape:',
    opts: [
      { label: '🚀 Bottle Rocket', win: 'Rocket Brunch Ending! (1/3)', art: '🚀🧇', text: 'You blasted out the roof straight into breakfast glory!' },
      { label: '🐶 Call Pancake Pup', win: 'Good Boy Heist Ending! (2/3)', art: '🐶🍯', text: 'Pancake Pup carried the syrup out while guards petted him!' },
      { label: '🥷 Swap with Brick', win: 'Sneaky Chef Ending! (3/3)', art: '🧱😎', text: 'Nobody noticed the brick until Tuesday. Smooth!' },
      { label: '📢 Yell "LOOK A BIRD!"', fail: 'You looked too and tripped over your own shoelaces.' }
    ]
  }
};
let cur = 'start', fails = new Set(), ends = new Set();

function render(failMsg, winObj) {
  document.getElementById('fails').textContent = `Fails Found: ${fails.size}`;
  document.getElementById('ends').textContent = `Endings: ${ends.size} / 3`;
  const st = document.getElementById('stage');
  if (failMsg) {
    st.innerHTML = `<div class="fail"><div class="art">💥😵</div><h2>FAIL!</h2><p><b>${failMsg}</b></p><button class="btn" style="margin-top:8px" onclick="render()">↺ Retry Choice</button></div>`;
    return;
  }
  if (winObj) {
    st.innerHTML = `<div class="scene" style="background:#c5e8c2"><div class="art">${winObj.art}</div><h2>🏆 ${winObj.win}</h2><p>${winObj.text}</p><button class="btn" onclick="cur='start';render()">Play Another Route!</button></div>`;
    return;
  }
  const s = SCENES[cur];
  st.innerHTML = `<div class="scene"><div class="art">${s.art}</div><h2>${s.title}</h2><p>${s.text}</p></div><div class="choices" id="ch"></div>`;
  const ch = document.getElementById('ch');
  s.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = o.label;
    b.onclick = () => {
      if (o.fail) { fails.add(o.label); render(o.fail); }
      else if (o.win) { ends.add(o.win); render(null, o); }
      else { cur = o.next; render(); }
    };
    ch.append(b);
  });
}
render();
</script>
</body>
</html>
