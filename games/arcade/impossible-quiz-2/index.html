<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Impossible Quiz 2: Waffle's Revenge</title>
<style>
  *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:'Trebuchet MS',system-ui,sans-serif;background:#f7dfb3;color:#4b2e20;display:flex;align-items:center;justify-content:center;padding:12px}
  .card{width:100%;max-width:680px;background:#fff9ec;border:4px solid #4b2e20;border-radius:26px;padding:18px;box-shadow:0 10px 0 #b87c42}
  .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px}
  .prompt{background:#dfd0f5;border:3.5px solid #4b2e20;border-radius:20px;padding:20px;font-size:21px;font-weight:900;text-align:center;min-height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:relative}
  .btn{border:3.5px solid #4b2e20;border-radius:18px;padding:14px;font-size:17px;font-weight:900;color:#4b2e20;background:#ffd3b8;cursor:pointer;box-shadow:0 6px 0 #c78d69;transition:transform .12s}
  .btn:active{transform:translateY(4px)}
  .btn.b1{background:#bfe0f7;box-shadow:0 6px 0 #7da8c9}
  .btn.b2{background:#c5e8c2;box-shadow:0 6px 0 #82b57f}
  .btn.b3{background:#ffe599;box-shadow:0 6px 0 #c9a13b}
  .secret{cursor:pointer;text-decoration:underline wavy #b84b36}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <button class="pill" id="qbadge">Level 1 / 15</button>
    <div class="pill" id="lives">❤️❤️❤️</div>
    <button class="pill" id="skip">⏭️ Skips: 2</button>
  </div>
  <div class="prompt" id="prompt"></div>
  <div class="grid" id="grid"></div>
  <p id="msg" style="text-align:center;font-weight:800;margin:12px 0 0;color:#7a5540"></p>
</div>
<script>
const Q = [
  { q: 'How many letters are in "THE ANSWER"?', opts: ['9', '10', '2', '3'], ok: 0, msg: 'Count T-H-E-A-N-S-W-E-R!' },
  { q: 'Quick! Click the FAKE Game Over button to actually win!', opts: ['Win Instantly', 'GAME OVER', 'Free Points', 'Skip'], ok: 1 },
  { q: 'What goes up and never comes down?', opts: ['A helium balloon', 'Your age!', 'Syrup', 'A boomerang'], ok: 1 },
  { q: 'Catch the runaway button!', runaway: true, opts: ['Wait for me!', 'Nope', 'Wrong', 'Trap'], ok: 0 },
  { q: 'Which word is spelled INCORRECTLY in every dictionary?', opts: ['Waffle', 'Incorrectly', 'Antidisestablishmentarianism', 'Queue'], ok: 1 },
  { q: 'Tap the word <span class="secret" id="sec">WAFFLE</span> right inside this question!', opts: ['Pancake', 'Waffle', 'Toast', 'Muffin'], ok: -1 },
  { q: 'If a plane crashes on the US/Canada border, where do you bury the survivors?', opts: ['USA', 'Canada', 'You don’t bury survivors!', 'In the ocean'], ok: 2 },
  { q: 'What is 10 + 10 = 1000 - 980?', opts: ['True!', 'False!', '20', '200'], ok: 0 },
  { q: 'Click the button whose COLOR matches the word "BANANA":', opts: ['APPLE', 'BANANA', 'SKY', 'GRASS'], colors: ['#ffe599', '#ff9e9e', '#bfe0f7', '#c5e8c2'], ok: 0 },
  { q: 'What gets wetter the more it dries?', opts: ['A sponge', 'A towel!', 'Rain', 'Soap'], ok: 1 },
  { q: 'Which number comes next? 1, 11, 21, 1211, 111221, ___', opts: ['312211', '122111', '222111', '999999'], ok: 0 },
  { q: 'A cowboy rides into town on Friday, stays 3 days, and leaves on Friday. How?', opts: ['Time travel', 'His horse is named Friday!', 'Magic', 'Calendar bug'], ok: 1 },
  { q: 'Tap the Level badge at top-left 3 times!', badgeTaps: 3, opts: ['Not me', 'Definitely not me', 'Still wrong', 'Nope'], ok: -1 },
  { q: 'I speak without a mouth and hear without ears. What am I?', opts: ['A ghost', 'An echo!', 'A telephone', 'Sir Waffle'], ok: 1 },
  { q: 'Final Trick! Click "Victory" — NOT "Click Me"!', opts: ['Click Me', 'Victory!', 'Click Me!', 'Free Candy'], ok: 1 }
];
let i = 0, lives = 3, skips = 2, taps = 0;
const qbadge = document.getElementById('qbadge'), livesEl = document.getElementById('lives'), skip = document.getElementById('skip'), prompt = document.getElementById('prompt'), grid = document.getElementById('grid'), msg = document.getElementById('msg');

function render() {
  taps = 0;
  qbadge.textContent = `Level ${i + 1} / ${Q.length}`;
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
  skip.textContent = `⏭️ Skips: ${skips}`;
  skip.disabled = skips <= 0;
  const item = Q[i];
  prompt.innerHTML = item.q;
  grid.innerHTML = '';
  const sec = document.getElementById('sec');
  if (sec) sec.onclick = win;
  item.opts.forEach((txt, idx) => {
    const b = document.createElement('button');
    b.className = `btn b${idx}`;
    b.textContent = txt;
    if (item.colors) b.style.background = item.colors[idx];
    if (item.runaway && idx === 0) {
      let dodges = 0;
      b.onmouseenter = () => {
        if (dodges < 3) {
          dodges++;
          b.style.transform = `translate(${(Math.random()*90-45)}px, ${(Math.random()*40-20)}px)`;
        }
      };
    }
    b.onclick = () => idx === item.ok ? win() : hurt();
    grid.append(b);
  });
}
function win() {
  i++;
  msg.textContent = 'Nice!! On to the next riddle!';
  if (i >= Q.length) {
    prompt.textContent = '👑 YOU OUTSMARTED WAFFLE’S REVENGE!';
    grid.innerHTML = '<button class="btn b3" style="grid-column:1/-1" onclick="i=0;lives=3;skips=2;render()">Play Again</button>';
    return;
  }
  render();
}
function hurt() {
  lives--;
  msg.textContent = 'Oof! Think trickier!';
  if (lives <= 0) {
    livesEl.textContent = '💀';
    prompt.textContent = '💥 Bamboozled! Try again!';
    grid.innerHTML = '<button class="btn b2" style="grid-column:1/-1" onclick="i=0;lives=3;skips=2;render()">Restart</button>';
    return;
  }
  livesEl.textContent = '❤️'.repeat(lives);
}
qbadge.onclick = () => {
  if (Q[i]?.badgeTaps) {
    taps++;
    msg.textContent = `${taps} / ${Q[i].badgeTaps} taps!`;
    if (taps >= Q[i].badgeTaps) win();
  }
};
skip.onclick = () => { if (skips > 0) { skips--; win(); } };
render();
</script>
</body>
</html>
