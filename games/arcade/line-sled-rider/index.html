<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sled Sketcher (Line Rider Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#e8f4fc;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:740px;background:#fff9ec;border:4px solid #4b2e20;border-radius:24px;padding:12px;box-shadow:0 10px 0 #95b8d1}
  .hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:6px 14px;font-weight:900;cursor:pointer}
  canvas{width:100%;height:auto;border:3.5px solid #4b2e20;border-radius:16px;background:#fffdf7;touch-action:none;display:block;cursor:crosshair}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <button class="pill" id="modeBtn" style="background:#c5e8c2">▶ RIDE SLED</button>
    <button class="pill" onclick="preset()">✨ Starter Ramp</button>
    <button class="pill" onclick="lines=[];stopRide()" style="background:#ffd2c2">🗑 Clear Track</button>
  </div>
  <canvas id="c" width="700" height="390"></canvas>
  <p style="margin:8px 0 0;text-align:center;font-weight:800;font-size:14px">Draw lines with your finger or mouse to catch the sledder, then hit RIDE SLED!</p>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let lines = [], drawing = false, last = null, riding = false;
let sled = { x: 80, y: 60, vx: 2.2, vy: 0, ang: 0 };

function preset() {
  stopRide();
  lines = [
    [[40,120],[160,190]],[[160,190],[290,260]],[[290,260],[410,275]],[[410,275],[500,245]],
    [[540,290],[660,330]]
  ];
}
function stopRide() {
  riding = false;
  sled = { x: 80, y: 60, vx: 2.2, vy: 0, ang: 0 };
  document.getElementById('modeBtn').textContent = '▶ RIDE SLED';
  document.getElementById('modeBtn').style.background = '#c5e8c2';
}
document.getElementById('modeBtn').onclick = () => {
  if (riding) stopRide();
  else {
    riding = true;
    sled = { x: 80, y: 60, vx: 2.5, vy: 0, ang: 0 };
    document.getElementById('modeBtn').textContent = '■ STOP & DRAW';
    document.getElementById('modeBtn').style.background = '#ffd2c2';
  }
};

function pt(e) {
  const r = c.getBoundingClientRect();
  return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height];
}
c.addEventListener('pointerdown', e => { if (!riding) { drawing = true; last = pt(e); } });
window.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pt(e);
  if (Math.hypot(p[0] - last[0], p[1] - last[1]) > 10) {
    lines.push([last, p]);
    last = p;
  }
});
window.addEventListener('pointerup', () => drawing = false);

function step() {
  if (!riding) return;
  sled.vy += 0.25;
  sled.x += sled.vx;
  sled.y += sled.vy;

  for (const [a, b] of lines) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len2 = dx * dx + dy * dy || 1;
    let t = ((sled.x - a[0]) * dx + (sled.y - a[1]) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = a[0] + t * dx, cy = a[1] + t * dy;
    const dist = Math.hypot(sled.x - cx, sled.y - cy);
    if (dist < 13) {
      let nx = -dy, ny = dx;
      if (ny > 0) { nx = -nx; ny = -ny; }
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const vn = sled.vx * nx + sled.vy * ny;
      if (vn < 0) {
        sled.x = cx + nx * 13;
        sled.y = cy + ny * 13;
        sled.vx -= vn * nx * 1.05;
        sled.vy -= vn * ny * 1.05;
        sled.vx *= 0.996;
        sled.ang = Math.atan2(dy, dx);
      }
    }
  }
  if (sled.y > c.height + 60 || sled.x > c.width + 80 || sled.x < -80) {
    sled = { x: 80, y: 60, vx: 2.5, vy: 0, ang: 0 };
  }
}

function draw() {
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#efe8da'; ctx.lineWidth = 1.5;
  for (let x = 0; x < c.width; x += 35) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke(); }
  for (let y = 0; y < c.height; y += 35) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke(); }

  ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const [a, b] of lines) {
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // Sledder
  ctx.save();
  ctx.translate(sled.x, sled.y);
  ctx.rotate(sled.ang);
  ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-16, 8); ctx.lineTo(14, 8); ctx.lineTo(20, 2); ctx.stroke();
  ctx.fillStyle = '#f28268';
  ctx.beginPath(); ctx.arc(0, -6, 7, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#7ec3d4'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-18, -10); ctx.stroke(); // scarf!
  ctx.restore();

  step();
  requestAnimationFrame(draw);
}
preset();
draw();
</script>
</body>
</html>
