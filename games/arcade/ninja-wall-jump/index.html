<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N-Runner Spire (Flash Ninja Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#f4e2d8;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .wrap{width:100%;max-width:680px;background:#fff9ec;border:4px solid #4b2e20;border-radius:24px;padding:12px;box-shadow:0 10px 0 #c99259}
  .hud{display:flex;justify-content:space-between;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 14px;font-weight:900}
  canvas{width:100%;height:auto;border:3.5px solid #4b2e20;border-radius:16px;background:#eef5f8;display:block}
  .pad{display:flex;gap:8px;margin-top:8px}
  .btn{flex:1;min-height:48px;border:3px solid #4b2e20;border-radius:14px;background:#dfd0f5;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="pill" id="gold">🪙 Gold: 0 / 5</div>
    <div class="pill" id="msg">Wall-jump to the Exit Door!</div>
    <button class="pill" onclick="reset()" style="cursor:pointer;background:#ffd2c2">↻</button>
  </div>
  <canvas id="c" width="640" height="380"></canvas>
  <div class="pad">
    <button class="btn" id="l">◀ Left</button>
    <button class="btn" id="r">Right ▶</button>
    <button class="btn" id="j" style="background:#c5e8c2">⬆ Wall-Jump</button>
  </div>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const keys = { l: false, r: false, j: false };
let ninja, plats, coins, mines, door, got = 0;

function reset() {
  got = 0;
  ninja = { x: 40, y: 310, vx: 0, vy: 0, w: 18, h: 24, ground: false, wall: 0 };
  plats = [
    [0,350,640,30],[160,120,24,230],[310,0,24,250],[460,110,24,240],[0,80,100,22],[520,110,120,22]
  ];
  coins = [[80,50],[230,220],[380,150],[420,280],[560,75]].map(([x,y])=>({x,y,ok:true}));
  mines = [{x:240,y:334},{x:390,y:334},{x:520,y:334}];
  door = { x: 580, y: 60 };
  document.getElementById('gold').textContent = '🪙 Gold: 0 / 5';
}
function bind(id, k) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  window.addEventListener('pointerup', () => keys[k] = false);
}
bind('l', 'l'); bind('r', 'r'); bind('j', 'j');
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true;
  if (e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); keys.j = true; }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false;
  if (e.key === 'ArrowUp' || e.key === ' ') keys.j = false;
});

function loop() {
  if (keys.l) ninja.vx -= 0.72;
  if (keys.r) ninja.vx += 0.72;
  ninja.vx *= 0.84;
  ninja.vy = Math.min(ninja.wall !== 0 ? 2.5 : 11, ninja.vy + 0.5);
  if (keys.j) {
    if (ninja.ground) { ninja.vy = -10.5; ninja.ground = false; }
    else if (ninja.wall !== 0) { ninja.vy = -10; ninja.vx = -ninja.wall * 8.2; ninja.wall = 0; }
  }
  ninja.x += ninja.vx; ninja.wall = 0;
  for (const [rx,ry,rw,rh] of plats) {
    if (ninja.x < rx+rw && ninja.x+ninja.w > rx && ninja.y < ry+rh && ninja.y+ninja.h > ry) {
      if (ninja.vx > 0) { ninja.x = rx - ninja.w; ninja.wall = 1; }
      else if (ninja.vx < 0) { ninja.x = rx + rw; ninja.wall = -1; }
      ninja.vx = 0;
    }
  }
  if (ninja.x < 0) { ninja.x = 0; ninja.wall = -1; }
  if (ninja.x + ninja.w > c.width) { ninja.x = c.width - ninja.w; ninja.wall = 1; }

  ninja.y += ninja.vy; ninja.ground = false;
  for (const [rx,ry,rw,rh] of plats) {
    if (ninja.x < rx+rw && ninja.x+ninja.w > rx && ninja.y < ry+rh && ninja.y+ninja.h > ry) {
      if (ninja.vy > 0) { ninja.y = ry - ninja.h; ninja.vy = 0; ninja.ground = true; }
      else if (ninja.vy < 0) { ninja.y = ry + rh; ninja.vy = 0; }
    }
  }
  for (const m of mines) if (Math.hypot(ninja.x+9-m.x, ninja.y+12-m.y) < 18) reset();
  for (const cn of coins) if (cn.ok && Math.hypot(ninja.x+9-cn.x, ninja.y+12-cn.y) < 20) {
    cn.ok = false; got++; document.getElementById('gold').textContent = `🪙 Gold: ${got} / 5`;
  }
  if (Math.hypot(ninja.x+9-door.x, ninja.y+12-door.y) < 28) {
    document.getElementById('msg').textContent = `⚡ SPIRE CLEARED! (${got}/5 gold)`;
  }

  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#9aaeb8'; ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3.5;
  for (const [rx,ry,rw,rh] of plats) { ctx.beginPath(); ctx.roundRect(rx,ry,rw,rh,6); ctx.fill(); ctx.stroke(); }
  for (const cn of coins) if (cn.ok) { ctx.fillStyle='#ffe17d'; ctx.beginPath(); ctx.arc(cn.x,cn.y,8,0,7); ctx.fill(); ctx.stroke(); }
  for (const m of mines) { ctx.fillStyle='#ff8075'; ctx.beginPath(); ctx.arc(m.x,m.y,10,0,7); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#9ee09e'; ctx.beginPath(); ctx.roundRect(door.x-14, door.y-22, 28, 44, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4b2e20'; ctx.beginPath(); ctx.roundRect(ninja.x, ninja.y, ninja.w, ninja.h, 6); ctx.fill();
  ctx.fillStyle = '#f28268'; ctx.fillRect(ninja.x-2, ninja.y+4, ninja.w+4, 5);
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
