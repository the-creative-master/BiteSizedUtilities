<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recoil Blaster (Fancade Recoil Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#dfd0f5;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .card{width:100%;max-width:680px;background:#fff9ec;border:4px solid #4b2e20;border-radius:26px;padding:12px;box-shadow:0 10px 0 #9f87c4;text-align:center}
  .hud{display:flex;justify-content:space-between;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 14px;font-weight:900}
  canvas{width:100%;height:auto;border:3.5px solid #4b2e20;border-radius:16px;background:#fff6e2;display:block;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<div class="card">
  <div class="hud">
    <div class="pill" id="lvl">Stage 1 / 4</div>
    <div class="pill" id="left">Targets: 3</div>
    <button class="pill" onclick="load(li)" style="cursor:pointer;background:#ffd2c2">↻ Retry</button>
  </div>
  <canvas id="c" width="640" height="380"></canvas>
  <p style="margin:8px 0 0;font-weight:800;font-size:14px">Tap/click anywhere to shoot — recoil launches you in the opposite direction!</p>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const STAGES = [
  { p:[120,260], t:[[420,120],[520,220],[320,80]] },
  { p:[320,300], t:[[120,110],[520,110],[320,80],[200,220]] },
  { p:[100,180], t:[[500,90],[500,280],[320,180],[220,90]] },
  { p:[320,190], t:[[90,90],[550,90],[90,290],[550,290],[320,70]] }
];
let li = 0, p, bullets, targets;

function load(n) {
  li = n % STAGES.length;
  p = { x: STAGES[li].p[0], y: STAGES[li].p[1], vx: 0, vy: 0 };
  bullets = [];
  targets = STAGES[li].t.map(([x, y]) => ({ x, y, ok: true }));
  document.getElementById('lvl').textContent = `Stage ${li + 1} / ${STAGES.length}`;
  document.getElementById('left').textContent = `Targets: ${targets.length}`;
}

c.addEventListener('pointerdown', e => {
  const r = c.getBoundingClientRect();
  const mx = (e.clientX - r.left) * c.width / r.width;
  const my = (e.clientY - r.top) * c.height / r.height;
  const ang = Math.atan2(my - p.y, mx - p.x);
  bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang) * 11, vy: Math.sin(ang) * 11, life: 60 });
  p.vx -= Math.cos(ang) * 6.5;
  p.vy -= Math.sin(ang) * 6.5;
});

function loop() {
  p.vy += 0.24;
  p.vx *= 0.985;
  p.x += p.vx; p.y += p.vy;
  if (p.x < 18 || p.x > c.width - 18) { p.vx *= -0.75; p.x = Math.max(18, Math.min(c.width - 18, p.x)); }
  if (p.y < 18 || p.y > c.height - 18) { p.vy *= -0.75; p.y = Math.max(18, Math.min(c.height - 18, p.y)); }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    for (const t of targets) {
      if (t.ok && Math.hypot(t.x - b.x, t.y - b.y) < 22) {
        t.ok = false; b.life = 0;
        const rem = targets.filter(x => x.ok).length;
        document.getElementById('left').textContent = `Targets: ${rem}`;
        if (rem === 0) setTimeout(() => load(li + 1), 350);
      }
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 3.5;
  for (const t of targets) if (t.ok) {
    ctx.fillStyle = '#ff8b80'; ctx.beginPath(); ctx.arc(t.x, t.y, 17, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff9ec'; ctx.beginPath(); ctx.arc(t.x - 5, t.y - 3, 4, 0, 7); ctx.arc(t.x + 5, t.y - 3, 4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#4b2e20';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#7ec3d4';
  ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, 7); ctx.fill(); ctx.stroke();
  requestAnimationFrame(loop);
}
load(0);
loop();
</script>
</body>
</html>
