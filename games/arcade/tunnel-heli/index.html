<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wafflecopter Tunnel (Flash Heli Style)</title>
<style>
  *{box-sizing:border-box;user-select:none}
  body{margin:0;min-height:100vh;background:#dceefb;color:#4b2e20;font-family:'Trebuchet MS',sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
  .card{width:100%;max-width:700px;background:#fff9ec;border:4px solid #4b2e20;border-radius:24px;padding:12px;box-shadow:0 10px 0 #8fb8d6;text-align:center}
  .hud{display:flex;justify-content:space-between;margin-bottom:8px}
  .pill{background:#ffe599;border:3px solid #4b2e20;border-radius:999px;padding:5px 14px;font-weight:900}
  canvas{width:100%;height:auto;border:3.5px solid #4b2e20;border-radius:16px;background:#cde7fc;display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="hud">
    <div class="pill" id="dist">Distance: 0m</div>
    <div class="pill" id="best">Best: 0m</div>
  </div>
  <canvas id="c" width="660" height="360"></canvas>
  <p style="margin:8px 0 0;font-weight:800;font-size:14px">Hold mouse, touch, or SPACE to fly upward through the cave!</p>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let hold = false, heli, walls, best = 0, dist = 0, dead = false;

function reset() {
  dead = false; dist = 0;
  heli = { x: 130, y: 180, vy: 0 };
  walls = [];
  for (let i = 0; i < 6; i++) {
    walls.push({ x: 420 + i * 170, y: 70 + Math.random() * 150, h: 72 });
  }
}
c.addEventListener('pointerdown', e => { e.preventDefault(); if (dead) reset(); else hold = true; });
window.addEventListener('pointerup', () => hold = false);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (dead) reset(); else hold = true; } });
window.addEventListener('keyup', e => { if (e.code === 'Space') hold = false; });

function loop() {
  ctx.clearRect(0, 0, c.width, c.height);
  if (!dead) {
    dist++;
    best = Math.max(best, dist);
    document.getElementById('dist').textContent = `Distance: ${dist}m`;
    document.getElementById('best').textContent = `Best: ${best}m`;
    heli.vy += hold ? -0.58 : 0.44;
    heli.vy = Math.max(-7.5, Math.min(8, heli.vy));
    heli.y += heli.vy;
    for (const w of walls) {
      w.x -= 4.3 + Math.min(3, dist / 900);
      if (w.x < -40) { w.x = c.width + 60; w.y = 55 + Math.random() * 170; }
      if (heli.x + 18 > w.x && heli.x - 18 < w.x + 30 && heli.y + 12 > w.y && heli.y - 12 < w.y + w.h) dead = true;
    }
    if (heli.y < 30 || heli.y > c.height - 30) dead = true;
  }

  // Cave ceiling & floor
  ctx.fillStyle = '#c98550'; ctx.strokeStyle = '#4b2e20'; ctx.lineWidth = 4;
  ctx.fillRect(0, 0, c.width, 26); ctx.strokeRect(0, 0, c.width, 26);
  ctx.fillRect(0, c.height - 26, c.width, 26); ctx.strokeRect(0, c.height - 26, c.width, 26);

  for (const w of walls) {
    ctx.fillStyle = '#f28268';
    ctx.beginPath(); ctx.roundRect(w.x, w.y, 30, w.h, 8); ctx.fill(); ctx.stroke();
  }

  // Wafflecopter
  ctx.fillStyle = '#ffe17d';
  ctx.beginPath(); ctx.roundRect(heli.x - 18, heli.y - 12, 36, 24, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#4b2e20';
  ctx.fillRect(heli.x - 24, heli.y - 18, 48, 4);

  if (dead) {
    ctx.fillStyle = 'rgba(255,249,236,0.92)';
    ctx.beginPath(); ctx.roundRect(170, 130, 320, 100, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4b2e20'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`CRASHED AT ${dist}m!`, 330, 174);
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Tap or press SPACE to fly again', 330, 206);
  }
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
