<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe — BiteSizedUtilities</title>
<script src="../arcade-controls.js"></script>

<!-- JavaScript file included -->
<script src="tic.js"></script>

<style>
	/* CSS Code */
	/* The page used to link a stylesheet that never shipped with it, and its
	   white headings sat on the browser's white page. This is that stylesheet:
	   the kitchen's own ink, so the white text has something to sit on. */
	body {
		background-color: #4f2f23;
		margin: 0;
		padding: 24px 0 40px;
	}

	/* Heading */
	h1 {
		color: white;
		font-size: 45px;
	}

	/* 3*3 Grid */
	#b1, #b2, #b3, #b4, #b5,
	#b6, #b7, #b8, #b9 {
		width: 80px;
		height: 52px;
		margin: auto;
		border: 1px solid #dedfe0;
		border-radius: 6px;
		font-size: 30px;
		text-align: center;
	}

  	#b1:hover, #b2:hover, #b3:hover, #b4:hover, #b5:hover,
	#b6:hover, #b7:hover, #b8:hover, #b9:hover {
		width: 80px;
		height: 52px;
		margin: auto;
		border: 1px solid red;
		border-radius: 6px;
		font-size: 30px;
		text-align: center;
    background-color:#dedfe0;
	}

	/* Reset Button */
	#but {
		box-sizing: border-box;
		width: 95px;
		height: 40px;
		border: 1px solid black;
		margin: auto;
		border-radius: 4px;
		font-family: Verdana,
			Geneva, Tahoma, sans-serif;

		background-color: white;
		color: black;
		font-size: 20px;
		cursor: pointer;
	}

	/* Player turn space */
	#print {
		font-family: Verdana,
			Geneva, Tahoma, sans-serif;

		color: white;
		font-size: 20px;
	}

#but:hover {
		box-sizing: border-box;
		width: 95px;
		height: 40px;
		border: 3px solid red;
		margin: auto;
		border-radius: 4px;
		font-family: Verdana,
			Geneva, Tahoma, sans-serif;

		background-color: #dedfe0;
		color: black;
		font-size: 20px;
		cursor: pointer;
	}

	/* Main Container */
	#main {
		text-align: center;
	}

	/* Game Instruction Text */
	#ins {
		font-family: Verdana,
			Geneva, Tahoma, sans-serif;
			
		color: white;
		font-size: 17px;
	}
</style>
</head>

<body>
	<div id="main">
		<h1>TIC TAC TOE</h1>

		<!-- Game Instructions -->
		<p id="ins">Game starts by just Tap on
			box<br><br>First Player starts as
			<b>Player X</b><br>And<br>Second
			Player as <b>Player 0</b>
		</p>


		<br><br>
		<!-- 3*3 grid of Boxes -->
		<input type="text" id="b1" onclick=
			"myfunc_3(); myfunc();" readonly>

		<input type="text" id="b2" onclick=
			"myfunc_4(); myfunc();" readonly>

		<input type="text" id="b3" onclick=
			"myfunc_5(); myfunc();" readonly>
		<br><br>

		<input type="text" id="b4" onclick=
			"myfunc_6(); myfunc();" readonly>
			
		<input type="text" id="b5" onclick=
			"myfunc_7(); myfunc();" readonly>

		<input type="text" id="b6" onclick=
			"myfunc_8(); myfunc();" readonly>
		<br><br>

		<input type="text" id="b7" onclick=
			"myfunc_9(); myfunc();" readonly>

		<input type="text" id="b8" onclick=
			"myfunc_10();myfunc();" readonly>

		<input type="text" id="b9" onclick=
			"myfunc_11();myfunc();" readonly>

		<!-- Grid end here -->
		<br><br><br>
		<!-- Button to reset game -->
		<button id="but" onclick="myfunc_2()">
			RESET
		</button>

		<br><br>
		<!-- Space to show player turn -->
		<p id="print"></p>


	</div>
</body>

</html>
