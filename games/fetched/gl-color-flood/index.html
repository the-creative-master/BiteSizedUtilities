<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Flood</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🌊 Color Flood</h1>
      <p class="tagline">Flood the grid from the top-left before you run out of moves.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
      <div class="stat"><span class="stat-label">Limit</span><span class="stat-value" id="limit">24</span></div>
      <div class="stat"><span class="stat-label">Filled</span><span class="stat-value" id="filled">0%</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <p class="message" id="message">Pick a color to flood.</p>
    </div>

    <footer class="controls" id="swatches"></footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
