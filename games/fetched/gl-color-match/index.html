<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="🟦 Color Match — a fast-paced, dependency-free HTML5 color-matching reaction game." />
  <meta name="theme-color" content="#0b0b1a" />
  <title>🟦 Color Match</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <main class="stage">
    <section class="panel" aria-label="Color Match game">
      <header class="topbar">
        <h1 class="title">🟦 Color Match</h1>
        <p class="tagline">Tap the swatch that matches the target before time runs out.</p>
      </header>

      <div class="hud" role="status" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Combo</span>
          <span class="stat-value" id="combo">x1</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="best">0</span>
        </div>
      </div>

      <div class="target-wrap">
        <span class="target-label">Match this color</span>
        <div class="target-swatch" id="target" aria-label="Target color"></div>
      </div>

      <div class="timer" aria-hidden="true">
        <div class="timer-fill" id="timer-fill"></div>
      </div>

      <div class="grid" id="grid" role="group" aria-label="Color options"></div>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 class="overlay-title" id="overlay-title">Ready?</h2>
          <p class="overlay-text" id="overlay-text">Click the swatch that matches the target color. Chain correct picks for a bigger combo.</p>
          <button class="btn" id="start-btn" type="button">Start Game</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
