<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🏃 Endless Runner</h1>
      <p class="tagline">Jump and duck — survive the auto-scrolling gauntlet.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      <div class="stat"><span class="stat-label">Speed</span><span class="stat-value" id="speed">1.0x</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="600" height="320"></canvas>
      <p class="message" id="message">Space / ↑ to jump, ↓ to duck. Click to start.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">Restart</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
