<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gomoku</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>⚫ Gomoku</h1>
      <p class="tagline">Five in a row beats the AI.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">You (●)</span><span class="stat-value" id="you">●</span></div>
      <div class="stat"><span class="stat-label">AI (○)</span><span class="stat-value" id="ai">○</span></div>
      <div class="stat"><span class="stat-label">Turn</span><span class="stat-value" id="turn">You</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="500" height="500"></canvas>
      <p class="message" id="message">Click to place your stone. Get five in a row.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">New Game</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
