<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Golf</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>⛳ Mini Golf</h1>
      <p class="tagline">Drag from the ball to aim, release to putt.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Strokes</span><span class="stat-value" id="strokes">0</span></div>
      <div class="stat"><span class="stat-label">Hole</span><span class="stat-value" id="hole">1</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="520" height="420"></canvas>
      <p class="message" id="message">Pull back from the ball and release to shoot.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">Restart Hole</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
