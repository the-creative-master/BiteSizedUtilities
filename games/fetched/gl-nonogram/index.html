<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nonogram</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🧩 Nonogram</h1>
      <p class="tagline">Paint the cells to reveal the hidden picture.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="level">1</span></div>
      <div class="stat"><span class="stat-label">Mistakes</span><span class="stat-value" id="miss">0</span></div>
      <div class="stat"><span class="stat-label">Max</span><span class="stat-value" id="max">5</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <p class="message" id="message">Click to fill, right-click to mark X.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">New Puzzle</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
