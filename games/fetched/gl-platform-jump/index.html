<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Jump</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🦘 Platform Jump</h1>
      <p class="tagline">Hop the floating platforms, grab coins, reach the flag.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Coins</span><span class="stat-value" id="coins">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">0.0s</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="600" height="360"></canvas>
      <p class="message" id="message">←/→ to move, Space / ↑ to jump. Reach the flag!</p>
    </div>

    <footer class="controls">
      <button class="btn" id="restart">Restart</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
