<!DOCTYPE html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><script src="offline-storage.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peg Solitaire</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🔘 Peg Solitaire</h1>
      <p class="tagline">Jump pegs to clear the board — finish with one in the center.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Pegs Left</span><span class="stat-value" id="pegs">32</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="420" height="420"></canvas>
      <p class="message" id="message">Click a peg, then a landing spot.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="new">New Game</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
